[build-system]
requires = ["setuptools>=61", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "picosim"
version = "0.1.0"
description = "ARMv6-M (Cortex-M0+) simulator for teaching ARM assembly"
requires-python = ">=3.8"
dependencies = [
    "pyelftools",
    "capstone",
    "cmake",
    "ninja",
    "pyserial",
]

[project.optional-dependencies]
# Testing's stand-in RP2040 (an emulator, to try Testing without hardware)
hwtest = ["unicorn>=2.0"]

[project.scripts]
picosim = "picosim.sim:main"

[tool.setuptools]
packages = ["picosim", "picosim.hwtest", "picosim.discover", "picosim.discover.cases"]

[tool.setuptools.package-data]
picosim = ["*.s", "*.ld", "*.c", "CMakeLists.txt"]
"picosim.hwtest" = ["*.s", "*.ld"]
"picosim.discover" = ["*.s", "fw/*.s"]