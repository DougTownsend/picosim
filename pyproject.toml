[build-system]
requires = ["setuptools>=61", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "picosim"
version = "0.1.0"
description = "ARMv6-M (Cortex-M0+) simulator for teaching ARM assembly"
requires-python = ">=3.8"
dependencies = [
    "pyelftools",
    "capstone",
    "cmake",
    "ninja",
    "pyserial",
]

[project.optional-dependencies]
# Ask picosim's optional AI help (picosim/chat/claude.py).  The anthropic SDK
# needs Python 3.10+; on older Pythons the extra installs nothing and the
# helper stays offline.
ai = ["anthropic>=1; python_version >= '3.10'"]

[project.scripts]
picosim = "picosim.sim:main"

[tool.setuptools]
packages = ["picosim", "picosim.chat"]

[tool.setuptools.package-data]
picosim = ["*.s", "*.ld", "*.c", "CMakeLists.txt"]